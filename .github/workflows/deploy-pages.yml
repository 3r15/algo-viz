name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 카탈로그는 배포 시점에 항상 새로 만든다 — 커밋된 index.json 이 뒤처져 있어도
      # 배포되는 사이트는 meta.json 들과 일치한다(생성물의 진실 원천은 meta.json).
      - name: 카탈로그 생성
        run: |
          node scripts/build-index.mjs
          node scripts/build-paradigm-index.mjs

      - uses: actions/configure-pages@v5
      - name: 아티팩트 업로드 (사이트 루트)
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
