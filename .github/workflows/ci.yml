name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: 트레이스 계약 검증
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 카탈로그 생성은 배포(deploy-pages.yml)가 맡는다 — 배포되는 사이트는 항상 최신이다.
      # 여기서는 커밋된 index.json 이 meta.json 과 어긋나지 않는지만 본다(로컬에서 열었을 때를 위해).
      # 어긋나면 무엇이 달라졌는지와 고치는 명령을 주석(annotation)으로 남긴다.
      - name: 카탈로그 최신성 검사
        run: npm run index:check
      - name: 모든 트레이스/메타 검증
        run: node scripts/validate-all.mjs
      - name: 해설 문서(walkthrough.md · notes.md) 구조 검증
        run: node scripts/validate-notes.mjs

  cpp-build:
    name: C++ 소스 컴파일 확인 (네이티브)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: g++ 로 모든 code/*.cpp 컴파일
        run: |
          shopt -s nullglob
          fail=0
          for f in algorithms/*/code/*.cpp *.cpp; do
            [ -e "$f" ] || continue
            echo "컴파일: $f"
            g++ -std=c++17 -O2 -fsyntax-only "$f" || fail=1
          done
          exit $fail
